  .chips{display:flex;flex-wrap:wrap;gap:0;border:1px solid var(--line);width:fit-content}

  .cta{display:flex;flex-wrap:wrap;gap:0;margin-top:18px;border:1px solid rgba(255,255,255,.35);width:fit-content}
  .cta a{text-decoration:none;font-weight:800;font-size:.98rem;border-radius:0;padding:12px 22px;background:none;color:#fff;border:0;border-inline-end:1px solid rgba(255,255,255,.35)}

  .cta a:first-child{background:var(--blue)}
  .who{color:#fff;font-weight:800;font-size:1.1rem;margin-top:20px}
  .fine{margin-top:14px;font-size:.82rem;color:rgba(255,255,255,.6)}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ======================================================================
   סימון "נמכר": נמצא בקובץ sold.json שליד הקובץ הזה.
   כדי לסמן פריט כנמכר, הוסיפו את המזהה שלו לרשימה, למשל:
   { "ids": ["sonos", "fridge"] }
   תמונות: בקובץ images.json, למשל
   { "sonos": ["img/sonos-1.jpg", "img/sonos-2.jpg"] }
   ====================================================================== */
const SOLD_BASE = [];

const LANGS = ["he","ru","en"];
let lang = (() => {
  try{
    const q = new URLSearchParams(location.search).get("lang");
    if(q && LANGS.includes(q.toLowerCase())) return q.toLowerCase();
  }catch(e){}
  return "he";
})();
let active = "all";
let sold = new Set(SOLD_BASE);
let adminMode = false;

const $ = id => document.getElementById(id);
const grid = $("grid"), emptyMsg = $("empty"), countEl = $("count"),
      chipsEl = $("chips"), q = $("q"), sheet = $("sheet"), lightbox = $("lightbox");

/* ---------- static text ---------- */
function paintChrome(){
  const t = UI[lang];
  document.documentElement.lang = lang;
  document.documentElement.dir = t.dir;
  document.body.dir = t.dir;
  $("t-eyebrow").textContent = t.eyebrow;
  const [head, ...rest] = t.title.split(" - ");
  $("t-title").innerHTML = rest.length
    ? `<span class="hl">${head}</span> ${rest.join(" - ")}`
    : head;
  $("t-lede").textContent = t.lede;
  document.title = t.title;

  $("t-terms").innerHTML = t.terms.map(([b,s])=>`<div class="term"><b>${b}</b><span>${s}</span></div>`).join("");

  q.placeholder = t.search;
  $("t-ctitle").textContent = t.ctitle;
  $("t-ctext").textContent = t.ctext;
  $("t-who").textContent = t.who;
  $("t-fine").textContent = t.fine;

  const opts = [["all", t.all, ITEMS.length]]
    .concat(CATS.map(c => [c, t.cats[c], ITEMS.filter(i=>i.c===c).length]));
  chipsEl.innerHTML = opts.map(([k,label,n]) =>
    `<button class="chip" type="button" data-cat="${k}" aria-pressed="${k===active}">${label}<span class="c">${n}</span></button>`).join("");
  $("catsel").innerHTML = opts.map(([k,label,n]) =>
    `<option value="${k}"${k===active?" selected":""}>${label} (${n})</option>`).join("");

  document.querySelectorAll("#langs button").forEach(b =>
    b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
}

/* ---------- cards ---------- */
function card(i){
  const t = UI[lang], L = i[lang];
  const off = i.o ? Math.round((1 - i.p/i.o)*100) : null;
  const isSold = sold.has(i.id);
  const shot = i.imgs.length
    ? `<button class="shot" type="button" data-lb="${i.id}">
         <img src="${i.imgs[0]}" alt="${L.n}" loading="lazy">
         ${i.imgs.length>1?`<span class="pcount">${t.photos(i.imgs.length)}</span>`:""}
       </button>`
    : `<div class="shot empty"><span>${t.noimg}</span></div>`;
  return `<article class="item${isSold?" is-sold":""}">
    ${isSold?`<span class="soldtag">${t.sold}</span>`:""}
    ${shot}
    <div class="pricebar">
      <span class="now">${t.curr(i.p)}</span>
      ${i.o?`<span class="was">${i.approx?t.approx:""}${t.curr(i.o)}</span>`:""}
      ${off!==null?`<span class="off">${off}% ${t.off}</span>`:""}
    </div>
    <div class="body">
      <span class="cat">${t.cats[i.c]}</span>
      <h3>${L.n}</h3>
      <p>${L.s}</p>
      <button class="more" type="button" data-sheet="${i.id}">${t.more}</button>
      ${adminMode?`<button class="markbtn" type="button" data-mark="${i.id}">${isSold?t.markAvail:t.markSold}</button>`:""}
    </div>
  </article>`;
}
function render(){
  const t = UI[lang], term = q.value.trim().toLowerCase();
  const list = ITEMS.filter(i =>
    (active === "all" || i.c === active) &&
    (!term || (i[lang].n + " " + i[lang].s + " " + i[lang].d).toLowerCase().includes(term))
  );
  grid.innerHTML = list.map(card).join("");
  emptyMsg.hidden = list.length > 0;
  emptyMsg.textContent = lang === "he" ? "לא נמצא פריט מתאים." : lang === "ru" ? "Ничего не найдено." : "No matching item.";
  countEl.innerHTML = t.shown(list.length, ITEMS.length);
}

/* ---------- modal ---------- */
function openSheet(id){
  const i = ITEMS.find(x=>x.id===id), t = UI[lang], L = i[lang];
  const off = i.o ? Math.round((1 - i.p/i.o)*100) : null;
  $("sheetbody").innerHTML = `
    <span class="cat">${t.cats[i.c]}</span>
    <h2>${L.n}${sold.has(i.id)?` — ${t.sold}`:""}</h2>
    <p class="full">${L.d}</p>
    ${i.imgs.length?`<div class="thumbs">${i.imgs.map((src,idx)=>
      `<button type="button" data-lb="${i.id}" data-idx="${idx}"><img src="${src}" alt=""></button>`).join("")}</div>`:""}
    <div class="pricebar">
      <span class="now">${t.curr(i.p)}</span>
      ${i.o?`<span class="was">${i.approx?t.approx:""}${t.curr(i.o)}</span>`:""}
      ${off!==null?`<span class="off">${off}% ${t.off}</span>`:""}
    </div>`;
  sheet.showModal();
}

/* ---------- lightbox ---------- */
let lbImgs = [], lbIdx = 0;
function openLb(id, idx){
  const i = ITEMS.find(x=>x.id===id);
  if(!i || !i.imgs.length) return;
  lbImgs = i.imgs; lbIdx = idx || 0;
  paintLb(); lightbox.showModal();
}
function paintLb(){
  $("lbimg").src = lbImgs[lbIdx];
  $("lbcount").textContent = `${lbIdx+1} / ${lbImgs.length}`;
  const one = lbImgs.length < 2;
  $("lbprev").hidden = one; $("lbnext").hidden = one; $("lbcount").hidden = one;
}
const step = d => { lbIdx = (lbIdx + d + lbImgs.length) % lbImgs.length; paintLb(); };

/* ---------- events ---------- */
document.addEventListener("click", e => {
  const lb = e.target.closest("[data-lb]");
  if(lb){ openLb(lb.dataset.lb, Number(lb.dataset.idx || 0)); return; }
  const more = e.target.closest("[data-sheet]");
  if(more){ openSheet(more.dataset.sheet); return; }
  const mark = e.target.closest("[data-mark]");
  if(mark){ toggleSold(mark.dataset.mark); return; }
  const cardEl = e.target.closest(".item");
  if(cardEl && !e.target.closest(".shot")){
    const art = cardEl.querySelector("[data-sheet]");
    if(art){ openSheet(art.dataset.sheet); return; }
  }
  const chip = e.target.closest(".chip");
  if(chip){ setCat(chip.dataset.cat); return; }
  const lng = e.target.closest("#langs button");
  if(lng){
    lang = lng.dataset.lang;
    try{
      const u = new URL(location.href);
      u.searchParams.set("lang", lang);
      history.replaceState(null, "", u);
    }catch(e){}
    paintChrome(); render();
  }
});
function setCat(v){
  active = v;
  chipsEl.querySelectorAll(".chip").forEach(c=>c.setAttribute("aria-pressed", String(c.dataset.cat===active)));
  $("catsel").value = active;
  render();
}
$("catsel").addEventListener("change", e => setCat(e.target.value));
q.addEventListener("input", render);
$("sheetclose").addEventListener("click", ()=>sheet.close());
$("lbclose").addEventListener("click", ()=>lightbox.close());
$("lbprev").addEventListener("click", ()=>step(-1));
$("lbnext").addEventListener("click", ()=>step(1));
lightbox.addEventListener("click", e => { if(e.target === lightbox) lightbox.close(); });
document.addEventListener("keydown", e => {
  if(!lightbox.open) return;
  if(e.key === "ArrowRight") step(1);
  if(e.key === "ArrowLeft") step(-1);
});

/* ---------- sold state (saved for everyone) ---------- */
function applySold(ids){
  sold = new Set(ids && ids.length ? ids : SOLD_BASE);
  render();
  if(sheet.open) sheet.close();
}
function toggleSold(id){
  sold.has(id) ? sold.delete(id) : sold.add(id);
  render();
}

render();
paintChrome();

fetch("sold.json", {cache:"no-store"})
  .then(r => r.ok ? r.json() : null)
  .then(d => { if(d && Array.isArray(d.ids)) applySold(d.ids); })
  .catch(()=>{});

fetch("images.json", {cache:"no-store"})
  .then(r => r.ok ? r.json() : null)
  .then(map => {
    if(!map) return;
    ITEMS.forEach(i => { if(Array.isArray(map[i.id]) && map[i.id].length) i.imgs = map[i.id]; });
    render();
  })
  .catch(()=>{});
</script>
</body>
</html>
